x-backend-service: &backend-service
  build:
    context: .
    dockerfile: apps/Dockerfile
  restart: unless-stopped
  networks:
    - personal-ai

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api-server
    networks:
      - personal-ai

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api-server:8080
    expose:
      - "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - personal-ai

  api-server:
    <<: *backend-service
    build:
      context: .
      dockerfile: apps/Dockerfile
      args:
        APP: api-server
    environment:
      API_PORT: 8080
      API_HOST: 0.0.0.0
      LEARNING_TEXT_REDIS_URL: ${LEARNING_TEXT_REDIS_URL:-}
      MESSAGE_CACHE_ENABLED: ${MESSAGE_CACHE_ENABLED:-false}
      RSS_COLLECTION_MODE: ${RSS_COLLECTION_MODE:-disabled}
      MODEL_AGENT_MODE: ${MODEL_AGENT_MODE:-disabled}
      MODEL_AGENT_OPENAI_API_KEY: ${MODEL_AGENT_OPENAI_API_KEY:-}
      MODEL_AGENT_CONFIGURATION_VERSION: ${MODEL_AGENT_CONFIGURATION_VERSION:-}
      MODEL_AGENT_CHAT_PRICE_VERSION: ${MODEL_AGENT_CHAT_PRICE_VERSION:-}
      MODEL_AGENT_CHAT_INPUT_PRICE_MICRO_PER_MILLION: ${MODEL_AGENT_CHAT_INPUT_PRICE_MICRO_PER_MILLION:-}
      MODEL_AGENT_CHAT_OUTPUT_PRICE_MICRO_PER_MILLION: ${MODEL_AGENT_CHAT_OUTPUT_PRICE_MICRO_PER_MILLION:-}
      MODEL_AGENT_EMBEDDING_PRICE_VERSION: ${MODEL_AGENT_EMBEDDING_PRICE_VERSION:-}
      MODEL_AGENT_EMBEDDING_PRICE_MICRO_PER_MILLION: ${MODEL_AGENT_EMBEDDING_PRICE_MICRO_PER_MILLION:-}
      MODEL_AGENT_PRICE_VALID_UNTIL_UNIX_MS: ${MODEL_AGENT_PRICE_VALID_UNTIL_UNIX_MS:-}
      MODEL_AGENT_PHASE_LIMIT_MICRO: ${MODEL_AGENT_PHASE_LIMIT_MICRO:-}
      MODEL_AGENT_DAILY_LIMIT_MICRO: ${MODEL_AGENT_DAILY_LIMIT_MICRO:-}
      MODEL_AGENT_DAILY_MODEL_CALLS: ${MODEL_AGENT_DAILY_MODEL_CALLS:-}
      MODEL_AGENT_DAILY_TOOL_CALLS: ${MODEL_AGENT_DAILY_TOOL_CALLS:-}
      CONVERSATION_REPLY_MODE: ${CONVERSATION_REPLY_MODE:-disabled}
      REPLY_OPENAI_API_KEY: ${REPLY_OPENAI_API_KEY:-}
      REPLY_CONFIGURATION_REVISION: ${REPLY_CONFIGURATION_REVISION:-}
      REPLY_PRICE_VERSION: ${REPLY_PRICE_VERSION:-}
      REPLY_INPUT_PRICE_MICRO_PER_MILLION: ${REPLY_INPUT_PRICE_MICRO_PER_MILLION:-}
      REPLY_OUTPUT_PRICE_MICRO_PER_MILLION: ${REPLY_OUTPUT_PRICE_MICRO_PER_MILLION:-}
      REPLY_REQUEST_LIMIT_MICRO: ${REPLY_REQUEST_LIMIT_MICRO:-}
      REPLY_DAILY_LIMIT_MICRO: ${REPLY_DAILY_LIMIT_MICRO:-}
      REPLY_PRICE_VALID_UNTIL_UNIX_MS: ${REPLY_PRICE_VALID_UNTIL_UNIX_MS:-}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      APP_ENV: ${APP_ENV:-development}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      KNOWLEDGE_ANSWER_ENABLED: ${KNOWLEDGE_ANSWER_ENABLED:-false}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      GIT_REPOSITORIES_JSON: ${GIT_REPOSITORIES_JSON:-[]}
      KNOWLEDGE_INDEX_ENABLED: ${KNOWLEDGE_INDEX_ENABLED:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-personal_knowledge}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OBJECT_STORE_ENABLED: ${OBJECT_STORE_ENABLED:-false}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY}
    expose:
      - "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-service
    build:
      context: .
      dockerfile: apps/Dockerfile
      args:
        APP: scheduler
    environment:
      RUN_FOREVER: "1"
      SCHEDULER_MODE: ${SCHEDULER_MODE:-disabled}
      RSS_SCHEDULES_ENABLED: ${RSS_SCHEDULES_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - personal-ai

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - personal-ai

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - personal-ai

  minio:
    build:
      context: ./infra/minio
      target: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - personal-ai

  minio-init:
    build:
      context: ./infra/minio
      target: mc
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempt=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          attempt=$$((attempt + 1)); [ "$$attempt" -lt 60 ] || exit 1; sleep 1
        done
        mc mb --ignore-existing "local/$$OBJECT_STORE_BUCKET"
    depends_on:
      minio:
        condition: service_started
    networks:
      - personal-ai

networks:
  personal-ai:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
